        function focusCountryOnMap(lat, lng) {
          if (window.store && window.KeplerGl) {
            // Obtener estado actual del mapa
            const state = window.store.getState();
            const mapState = state && state.keplerGl && state.keplerGl.map && state.keplerGl.map.mapState;
            if (mapState) {
              const steps = 25;
              const duration = 600; // ms
              const interval = duration / steps;
              const startLat = mapState.latitude;
              const startLng = mapState.longitude;
              const startZoom = mapState.zoom;
              const endLat = lat;
              const endLng = lng;
                const endZoom = 3;
              let currentStep = 0;
              function easeInOut(t) {
                return t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t;
              }
              function animate() {
                currentStep++;
                const t = easeInOut(currentStep / steps);
                const newLat = startLat + (endLat - startLat) * t;
                const newLng = startLng + (endLng - startLng) * t;
                  let newZoom = startZoom + (endZoom - startZoom) * t;
                  if (newZoom > 3) newZoom = 3;
                  window.store.dispatch(
                    window.KeplerGl.updateMap({
                      latitude: newLat,
                      longitude: newLng,
                      zoom: newZoom
                    })
                  );
                if (currentStep < steps) {
                  setTimeout(animate, interval);
                }
              }
              animate();
            } else {
              // fallback instant move
                window.store.dispatch(
                  window.KeplerGl.updateMap({
                    latitude: lat,
                    longitude: lng,

  <script>
    // Fullscreen button logic (mantener region-buttons visible)
    document.addEventListener('DOMContentLoaded', function () {
      var fullscreenBtn = document.getElementById('fullscreen-btn');
      var appDiv = document.getElementById('app');
      var regionButtons = document.getElementById('region-buttons');
      var regionButtons2 = document.getElementById('region-buttons2');
      var regionButtons3 = document.getElementById('region-buttons3');
      if (fullscreenBtn && appDiv) {
        fullscreenBtn.addEventListener('click', function () {
          // Si ya está en fullscreen, salir
          if (!document.fullscreenElement) {
            // Crear un contenedor para app y region-buttons
            var fsContainer = document.createElement('div');
            fsContainer.id = 'fs-container';
            fsContainer.style.position = 'relative';
            fsContainer.style.width = '100vw';
            fsContainer.style.height = '100vh';
            // Insertar el contenedor antes de appDiv
            appDiv.parentNode.insertBefore(fsContainer, appDiv);
            // Mover region-buttons y appDiv al contenedor
            fsContainer.appendChild(regionButtons);
            fsContainer.appendChild(regionButtons2);
            fsContainer.appendChild(regionButtons3);
            fsContainer.appendChild(appDiv);
            // Solicitar fullscreen
            if (fsContainer.requestFullscreen) {
              fsContainer.requestFullscreen();
            } else if (fsContainer.webkitRequestFullscreen) {
              fsContainer.webkitRequestFullscreen();
            } else if (fsContainer.msRequestFullscreen) {
              fsContainer.msRequestFullscreen();
            }
          } else {
            if (document.exitFullscreen) {
              document.exitFullscreen();
            } else if (document.webkitExitFullscreen) {
              document.webkitExitFullscreen();
            } else if (document.msExitFullscreen) {
              document.msExitFullscreen();
            }
          }
        });
      }
      // Al salir de fullscreen, devolver los elementos a su lugar
      document.addEventListener('fullscreenchange', function () {
        if (!document.fullscreenElement) {
          var fsContainer = document.getElementById('fs-container');
          if (fsContainer) {
            var body = document.body;
            var appDiv = document.getElementById('app');
            // Devolver region-buttons y appDiv al body
            var regionButtons = document.getElementById('region-buttons');
            var regionButtons2 = document.getElementById('region-buttons2');
            var regionButtons3 = document.getElementById('region-buttons3');
            if (regionButtons && body) {
              body.insertBefore(regionButtons, body.firstChild);
            }
            if (regionButtons2 && body) {
              body.insertBefore(regionButtons2, body.firstChild);
            }
            if (regionButtons3 && body) {
              body.insertBefore(regionButtons3, body.firstChild);
            }
            if (appDiv && body) {
              body.appendChild(appDiv);
            }
            fsContainer.remove();
          }
        }
      });
    });
    // Accordion toggle for legend content with icon
    const toggleBtn = document.getElementById('toggle-legend-btn');
    const legendContent = document.getElementById('legend-content');
    const iconUp = document.getElementById('icon-up');
    const iconDown = document.getElementById('icon-down');
    let legendVisible = true;
    if (toggleBtn && legendContent && iconUp && iconDown) {
      toggleBtn.addEventListener('click', function () {
        legendVisible = !legendVisible;
        if (legendVisible) {
          legendContent.style.display = '';
          iconUp.style.display = 'none';
          iconDown.style.display = 'inline';
        } else {
          legendContent.style.display = 'none';
          iconUp.style.display = 'inline';
          iconDown.style.display = 'none';
        }
      });
    }
  </script>

            </ul>

<script>
function showModalTab(tab) {
  document.getElementById('modalTabContract').style.display = tab === 'contract' ? 'block' : 'none';
  document.getElementById('modalTabLines').style.display = tab === 'lines' ? 'block' : 'none';
  document.getElementById('tabContractType').style.borderBottom = tab === 'contract' ? '2px solid #ff7300' : 'none';
  document.getElementById('tabLinesBusiness').style.borderBottom = tab === 'lines' ? '2px solid #ff7300' : 'none';
}
function openCountryModal(name, type) {
  // Guardar la posición actual del mapa antes de abrir el modal
  if (window.saveCurrentMapPosition) {
    window.saveCurrentMapPosition();
  }
  // Simular un click fuera del mapa (fuera de cualquier punto/bullet) para limpiar cualquier pin/fijación/tooltip
  var appDiv = document.getElementById('app');
  if (appDiv) {
    var evt = new MouseEvent('contextmenu', {
      bubbles: true,
      cancelable: true,
      view: window,
      button: 2,
      clientX: 10,
      clientY: 10 // fuera del área de los bullets
    });
    appDiv.dispatchEvent(evt);
  }
  // Limpiar cualquier pin/fijación/tooltip en el store de Kepler.gl
  if (window.store && window.KeplerGl) {
    try {
      var state = window.store.getState();
      var kepler = state && state.keplerGl && state.keplerGl.map;
      if (kepler && kepler.hoverInfo) {
        window.store.dispatch(window.KeplerGl.updateMapHover({
          mapId: 'map',
          hover: null
        }));
      }
      if (kepler && kepler.clicked) {
        window.store.dispatch({
          type: 'MAP_CLICK',
          payload: { mapId: 'map', click: null }
        });
      }
      if (kepler && kepler.pinned) {
        window.store.dispatch(window.KeplerGl.toggleMapPopoverPin({
          mapId: 'map',
          isPinned: false
        }));
      }
    } catch (e) {}
  }
  var countryNameEl = document.getElementById('modalCountryName');
  var modal = document.getElementById('countryModal');
  if (countryNameEl) countryNameEl.textContent = name;
  if (modal) modal.style.display = 'flex';

  // Fetch country data
  var country = name ? name.trim().toUpperCase() : '';
  var url = 'https://active-re-web-back-bhgdggh3b4amhsa0.eastus-01.azurewebsites.net/items/global_presence_countries?search=' + encodeURIComponent(country);
  var secondUrl= `https://active-re-web-back-bhgdggh3b4amhsa0.eastus-01.azurewebsites.net/items/global_presence_default`;
  (async function() {
    try {
      const [countryRes, titlesRes] = await Promise.all([
        fetch(url),
        fetch(secondUrl)
      ]);
      const countryData = await countryRes.json();
      const titles = await titlesRes.json();
      if (!countryData || !countryData.data || !countryData.data[0]) return;
      var info = countryData.data[0];
      var title = titles.data;
    // Map SVG
        var mapImg = document.querySelector('#countryModalContent img');
        mapImg.src = `/maps/${country}.svg`;
      // Contract Type tab
      document.getElementById('modalTabContract').innerHTML = `
        <div style="background:#ffff;padding:18px 16px;border-radius:8px;">
          <div style="font-weight:600;margin-bottom:8px;">
          ${title?.type_title}</div>
          <div style="margin-bottom:16px;">
            ${info?.treaty_content? `<span class="text-modal" style="display:flex;align-items:start;gap:4px;"><div>🔸</div><div>${title?.treaty_title}: <span class="text-modal" style="color:#70767c;">${info?.treaty_content}</span></div></span>`:''}
            ${info?.facultative_content? `<span class="text-modal" style="display:flex;align-items:start;gap:4px;"><div>🔸</div><div>${title?.facultative_title}: <span class="text-modal" style="color:#70767c;"> ${info?.facultative_content}</span></div></span>`:''}
            ${info?.mgas? `<span class="text-modal" style="display:flex;align-items:start;gap:4px;"><div>🔸</div><div>${title?.mgas_title}: <span  class="text-modal"style="color:#70767c;">${info?.mgas}</span></div></span>`:''}
          </div>
          <div style="font-weight:600;margin-bottom:8px;">${title?.attention_title}</div>
          <ul style="font-size:1em;">
            <li class="text-modal" style="display:flex;align-items:start;gap:8px;">
              <div>🕗</div> <div>${title?.response_times_title}: <span style="color:#70767c;">${info?.response_time || ''}</span></div>
            </li>
            <li class="text-modal" style="display:flex;align-items:start;gap:8px;">
              <div>📍</div> <div>${title?.placement_title}: <span style="color:#70767c;">${info?.placement || ''}</span></div>
            </li>
            <li class="text-modal" style="display:flex;align-items:start;gap:8px;">
              <div>📄</div> <div>${title?.documentation_title}: <span style="color:#70767c;">${info?.documentation || ''}</span></div>
            </li>
          </ul>
        </div>
      `;
      // Lines of Business tab
      var linesHtml = `<div style="background:#ffff;padding:18px 16px;border-radius:8px;">
          <div style="font-weight:600;margin-bottom:8px;">${title?.lines_of_business_title}</div>
      <ul style="font-size:1em;">
        `;
      if (Array.isArray(info.lines)) {
        info.lines.forEach(line => {
          linesHtml += `<li class="text-modal">🔸 ${line}</li>`;
        });
      }
      linesHtml += `
      <div style="margin-top:16px;margin-bottom:6px;font-size:1em;">🔗 Learn more in our <a style="color:#ff7300;" href="/lines-of-business" target="_blank">Lines of Business</a> section</div>
      <div style="margin-top:6px;margin-bottom:16px;font-size:1em;">📩 Contact our <a style="color:#ff7300;" href="/our-team" target="_blank">Underwriting Team </a> directly</div>

      </ul> </div></div> `;
      document.getElementById('modalTabLines').innerHTML = linesHtml;
    } catch (err) {
      console.error('Error fetching country or titles data:', err);
    }
  })();
}
function closeCountryModal() {
  // Restaurar la posición y datos iniciales del mapa al cerrar el modal
  if (window.restoreMapState) {
    window.restoreMapState();
  }
  // Quitar cualquier punto fijado/seleccionado en Kepler.gl
  if (window.store && window.KeplerGl) {
    try {
      var state = window.store.getState();
      var kepler = state && state.keplerGl && state.keplerGl.map;
      // Quitar hoverInfo
      if (kepler && kepler.hoverInfo) {
        window.store.dispatch(window.KeplerGl.updateMapHover({
          mapId: 'map',
          hover: null
        }));
      }
      // Quitar clicked (punto seleccionado)
      if (kepler && kepler.clicked) {
        window.store.dispatch({
          type: 'MAP_CLICK',
          payload: { mapId: 'map', click: null }
        });
      }
      // Quitar pin (punto fijado)
      if (kepler && kepler.pinned) {
        window.store.dispatch(window.KeplerGl.toggleMapPopoverPin({
          mapId: 'map',
          isPinned: false
        }));
      }
    } catch (e) {}
  }

  // Simular click sobre el SVG que cierra el pin/fijación
  var pinSvg = document.querySelector('svg.data-ex-icons-pin');
  if (pinSvg) {
    var evt = new MouseEvent('click', {
      bubbles: true,
      cancelable: true,
      view: window,
      button: 0,
      buttons: 0,
      clientX: pinSvg.getBoundingClientRect().left + 1,
      clientY: pinSvg.getBoundingClientRect().top + 1
    });
    pinSvg.dispatchEvent(evt);
    // Esperar brevemente y luego cerrar el modal personalizado
      var modal = document.getElementById('countryModal');
      if (modal) {
        modal.style.display = 'none';
        modal.classList.remove('show', 'active');
        document.getElementById('modalCountryName').textContent = '';
        void modal.offsetWidth;
      }
  } else {
    // Si no hay pin, cerrar el modal normalmente
    var modal = document.getElementById('countryModal');
    if (modal) {
      modal.style.display = 'none';
      modal.classList.remove('show', 'active');
      document.getElementById('modalCountryName').textContent = '';
      void modal.offsetWidth;
    }
  }
  // Eliminar todos los tooltips/popovers de Kepler del DOM
  var popovers = document.querySelectorAll('.map-popover');
  popovers.forEach(function(popover) {
    popover.style.display = 'none';
    popover.classList.remove('active', 'pinned');
    void popover.offsetWidth;
  });
}

// Interceptar el tooltip de Kepler.gl y mostrar el modal personalizado solo al hacer click
document.addEventListener('click', function(e) {
  var popover = document.querySelector('.map-popover');
  if (popover && popover.style.display !== 'none') {
    // Extraer nombre y tipo del tooltip
    var country = '';
    var type = '';
    var rows = popover.querySelectorAll('table tr');
    rows.forEach(function(row) {
      var cells = row.querySelectorAll('td');
      if (cells.length === 2) {
        var label = cells[0].textContent.trim();
        var value = cells[1].textContent.trim();
        if (/country/i.test(label)) country = value;
        if (/type/i.test(label)) type = value;
      }
    });
    if (country) {
      openCountryModal(country, type);
    }
  }
});

// Cerrar el modal al hacer click fuera del contenido
var modalOverlay = document.getElementById('countryModal');
if (modalOverlay) {
  modalOverlay.addEventListener('click', function(e) {
    if (e.target === modalOverlay) {
      closeCountryModal();
    }
  });
}
// Prevenir cierre al hacer click dentro del contenido
var modalContent = document.getElementById('countryModalContent');
if (modalContent) {
  modalContent.addEventListener('click', function(e) {
    e.stopPropagation();
  });
}
</script>
